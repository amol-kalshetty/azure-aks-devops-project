apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-demo
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: azure-aks-demo

  template:
    metadata:
      labels:
        app: azure-aks-demo

    spec:
      containers:
        - name: azure-aks-demo
          image: acraksdevopsdemo123.azurecr.io/azure-aks-demo:v4

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: azure-aks-demo-config

            - secretRef:
                name: azure-aks-demo-secret      

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
           httpGet:
             path: /health
             port: 8080
           initialDelaySeconds: 15
           periodSeconds: 20    

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"   